<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login Access | R SPORTS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen m-0 p-0 overflow-hidden flex flex-col md:flex-row">

  <div class="hidden md:block md:w-[60%] relative h-full bg-slate-900">
    <img 
      src="https://i.pinimg.com/1200x/34/59/23/345923e1379a9e2e176daefe9796538e.jpg" 
      class="w-full h-full object-cover filter brightness-[0.4] contrast-[1.1]" 
      alt="Sports Motivation Background"
    >
    <div class="absolute inset-0 bg-gradient-to-r from-transparent to-slate-950/80"></div>
    
    <div class="absolute bottom-16 left-16 max-w-md space-y-2 z-10">
      <span class="text-[10px] font-black tracking-widest text-blue-500 uppercase bg-blue-500/10 px-3 py-1 rounded-md border border-blue-500/20">
        Member Area
      </span>
      <h2 class="text-3xl font-extrabold text-white uppercase tracking-tight">
        Push Your Boundaries
      </h2>
      <p class="text-xs text-slate-400 leading-relaxed">
        MASUK KEDALAM AKUN ANDA DAN LANJUTKAN PERJALANAN MENGGAPAI PEFORMA TERBAIK BERSAMA R SPORTS.
      </p>
    </div>
  </div>

  <div class="w-full md:w-[40%] h-screen md:h-full bg-slate-950 flex flex-col justify-between p-6 md:p-12 relative z-10 box-border">
    
    <div class="flex items-center justify-between shrink-0">
      <h1 class="text-lg font-extrabold tracking-widest text-white">
        R <span class="text-blue-500">SPORTS</span>
      </h1>
       <a href="../view/Landingpage.html" class="text-[11px] font-bold uppercase tracking-wider text-cyan-400 border border-cyan-500/30 px-4 py-1.5 rounded-full bg-cyan-950/40 hover:bg-gradient-to-r hover:from-cyan-500 hover:to-blue-600 hover:text-white hover:border-transparent transition-all duration-300">
        Kembali
      </a>
    </div>

    <div class="w-full max-w-sm mx-auto my-auto space-y-5 py-4 md:py-0">
      <div class="space-y-1">
        <h3 class="text-xl md:text-2xl font-extrabold text-white tracking-tight uppercase">Welcome Back</h3>
        <p class="text-[11px] md:text-xs text-slate-500 font-medium">Silakan masukkan email dan password akun juara lu.</p>
      </div>

      <form onsubmit="login(event)" class="space-y-4">
        <div class="space-y-1.5">
          <label for="email" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Email Address</label>
          <input 
            id="email" 
            type="email" 
            placeholder="nama@email.com"
            class="w-full h-11 bg-slate-900 border border-slate-800/80 rounded-xl px-4 text-xs font-medium text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500/60 focus:ring-1 focus:ring-blue-500/20 transition duration-300" 
            required
          >
        </div>

        <div class="space-y-1.5">
          <label for="password" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Password</label>
          <input 
            id="password" 
            type="password" 
            placeholder="••••••••"
            class="w-full h-11 bg-slate-900 border border-slate-800/80 rounded-xl px-4 text-xs font-medium text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500/60 focus:ring-1 focus:ring-blue-500/20 transition duration-300" 
            required
          >
        </div>

        <div class="pt-1 space-y-3">
          <button class="w-full h-11 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold uppercase tracking-widest rounded-xl shadow-lg shadow-blue-600/10 transition-all duration-300 transform active:scale-[0.98]">
            Log In
          </button>

          <div id="error-box" class="hidden w-full p-3 bg-red-950/40 border border-red-500/30 rounded-xl text-[11px] font-semibold text-red-400 text-center tracking-wide uppercase transition-all duration-300 transform opacity-0 scale-95"></div>
        </div>
      </form>
    </div>

    <div class="text-center md:text-left text-[10px] text-slate-600 tracking-wide border-t border-slate-900/60 pt-3 shrink-0">
      &copy; 2026 R Sports Official Platform.
    </div>

  </div>

  <script src="../scripts/login.js"></script>

</body>
</html>
