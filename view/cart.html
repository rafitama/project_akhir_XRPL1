<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Keranjang Belanja | R SPORTS</title>
</head>
<body class="bg-slate-950 min-h-screen font-sans antialiased text-slate-100 flex flex-col justify-between">

  <nav class="bg-slate-900/80 backdrop-blur-md text-white px-6 md:px-12 h-16 flex items-center justify-between sticky top-0 z-50 shrink-0 border-b border-cyan-500/20">
    <h1 class="text-xl font-black tracking-wider shrink-0">
      <span class="text-white">R</span> 
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">SPORTS</span>
    </h1>
    <a href="HomePage.html" class="text-[11px] font-bold uppercase tracking-wider text-slate-400 border border-slate-800 px-4 py-1.5 rounded-full bg-slate-900 hover:text-cyan-400 hover:border-cyan-500/40 transition-all duration-300">
      Kembali Belanja
    </a>
  </nav>

  <main class="w-full max-w-6xl mx-auto p-4 md:p-8 flex-grow flex flex-col gap-6">
    <h2 class="text-2xl font-black uppercase tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white to-cyan-400">
      Keranjang Belanja Anda
    </h2>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start w-full">
      <div class="lg:col-span-8 space-y-4 w-full">
        <div id="global-select-container" class="hidden bg-slate-900/40 border border-slate-800/80 rounded-xl p-4 flex items-center gap-3">
          <input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll(this.checked)" class="w-4 h-4 rounded bg-slate-950 border-slate-800 text-cyan-500 focus:ring-cyan-500 focus:ring-offset-slate-950 cursor-pointer">
          <label for="select-all-checkbox" class="text-xs font-bold uppercase tracking-wider text-slate-300 cursor-pointer select-none">Pilih Semua Barang</label>
        </div>

        <div id="cart-empty-message" class="hidden bg-slate-900/40 border border-slate-800 rounded-3xl p-12 text-center space-y-4">
          <p class="text-4xl">🛒</p>
          <p class="text-slate-400 text-sm font-semibold">Keranjang belanja lu masih kosong melompong, brayy!</p>
          <a href="HomePage.html" class="inline-block bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold uppercase px-6 py-2.5 rounded-xl transition duration-300">Cari Produk Sekarang</a>
        </div>

        <div id="cart-items-container" class="space-y-3"></div>
      </div>

      <div class="lg:col-span-4 bg-slate-900/40 backdrop-blur-sm rounded-3xl border border-slate-800/80 p-6 shadow-xl space-y-5 w-full">
        <h3 class="text-xs font-black text-slate-200 uppercase tracking-wider border-b border-slate-800 pb-2">Ringkasan Belanja</h3>
        <div class="space-y-3 text-xs">
          <div class="flex justify-between text-slate-400">
            <span>Barang Terpilih</span>
            <span id="summary-total-items" class="font-bold text-slate-200">0 Item</span>
          </div>
          <div class="flex justify-between text-slate-400">
            <span>Biaya Pengiriman</span>
            <span class="text-emerald-400 font-bold uppercase tracking-wide">GRATIS ONGKIR</span>
          </div>
          <hr class="border-slate-800/60">
          <div class="flex justify-between items-center pt-1">
            <span class="text-slate-300 font-bold">Total Harga</span>
            <span id="summary-total-price" class="text-lg font-black text-cyan-400">Rp 0</span>
          </div>
        </div>
        <button onclick="processCheckout()" class="w-full h-12 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-xs font-black uppercase tracking-wider rounded-xl transition-all duration-300 flex items-center justify-center gap-1.5 shadow-md">
          Bayar Barang Terpilih
        </button>
      </div>
    </div>
  </main>

  <div id="checkout-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm"></div>
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-sm relative transform transition-all">
      <div class="text-center">
        <div class="w-16 h-16 bg-cyan-500/10 text-cyan-400 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl font-bold">
          ✓
        </div>
        <h3 class="text-lg font-black text-white uppercase tracking-wider mb-2">Checkout Berhasil!</h3>
        <p id="modal-msg" class="text-xs text-slate-400 leading-relaxed mb-6"></p>
        <button onclick="closeModal()" class="w-full h-11 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-black uppercase tracking-wider rounded-xl transition-all">
          Sip, Mengerti
        </button>
      </div>
    </div>
  </div>

  <footer class="bg-slate-950 border-t border-slate-900 text-slate-600 text-center py-6 text-sm w-full">
    <p>&copy; 2026 R Sports. All Rights Reserved.</p>
  </footer>

  <div id="toast" class="fixed bottom-6 right-6 bg-slate-900/90 backdrop-blur-md border border-cyan-500/40 text-cyan-400 text-[11px] font-black uppercase tracking-wider px-5 py-3 rounded-xl shadow-2xl opacity-0 translate-y-4 transition-all duration-300 pointer-events-none z-50"></div>

  <script src="../scripts/Cart.js"></script>
</body>
</html>
