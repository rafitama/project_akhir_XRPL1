<!doctype html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>R Sports - Premium Store</title>
</head>

<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

<nav class="bg-slate-900/90 backdrop-blur-md text-white p-4 fixed w-full top-0 z-50 border-b border-cyan-500/20">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-4 justify-between items-center">
    
    <h1 class="text-xl font-black tracking-wider shrink-0">
      <span class="text-white">R</span> 
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 glow-text">SPORTS</span>
    </h1>

    <div class="relative w-full md:max-w-xl mx-0 md:mx-4">
      <input
        type="text"
        placeholder="Cari produk olahraga premium..."
        oninput="searchProduct(this.value)"
        class="w-full p-2.5 pl-11 bg-slate-950 border border-slate-800 rounded-xl shadow-inner focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 text-sm text-slate-200 transition duration-300 placeholder-slate-500"
      />
      <svg viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.604 10.604Z" />
      </svg>
    </div>
    
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='profil.html'" class="w-10 h-10 flex items-center justify-center rounded-full border border-slate-800 bg-slate-900 hover:border-cyan-500/50 text-slate-400 hover:text-cyan-400 transition-all">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>
      <a href="cart.html" class="w-10 h-10 flex items-center justify-center rounded-full border border-slate-800 bg-slate-900 hover:border-cyan-500/50 text-slate-400 hover:text-cyan-400 transition-all">
        🛒
      </a>
    </div>

  </div>
</nav>

<section class="relative h-[75vh] w-full overflow-hidden mt-16">
  <img
    src="https://cdn.corenexis.com/files/c/5251668720.png"
    class="absolute inset-0 w-full h-full object-cover"
    alt="Premium Sports Background"
  />
  <div class="absolute inset-0 bg-gradient-to-b from-slate-950/50 via-slate-950/80 to-slate-950"></div>

  <div class="relative h-full flex items-center max-w-7xl mx-auto px-6">
    <div class="max-w-2xl">
      <h1 class="text-5xl md:text-6xl font-black text-white leading-tight">
        R <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 glow-text">SPORTS</span>
      </h1>
      <p class="text-slate-400 mt-4 text-lg">
        Temukan perlengkapan olahraga premium pilihan dengan kualitas terbaik dunia.
      </p>
      <a href="#product-section"
        class="inline-block mt-8 bg-gradient-to-r from-cyan-500 to-blue-600 px-8 py-3.5 rounded-xl text-white font-bold tracking-wide duration-300 hover:scale-105">
        Belanja Sekarang
      </a>
    </div>
  </div>
</section>

<div class="max-w-7xl mx-auto w-full px-4 mt-10 flex flex-wrap gap-3 justify-center">
  <button onclick="filterCategory('all')" id="btn-all" class="text-xs font-bold tracking-wider uppercase px-6 py-2.5 rounded-full border border-cyan-500 bg-cyan-950/40 text-cyan-400 transition-all duration-200 shadow-[0_0_12px_rgba(6,182,212,0.3)]">ALL PRODUCTS</button>
  <button onclick="filterCategory('Men')" id="btn-Men" class="text-xs font-bold tracking-wider uppercase px-6 py-2.5 rounded-full border border-slate-800 bg-slate-900 text-slate-400 hover:border-cyan-500/50 hover:text-cyan-400 transition-all duration-200">MEN'S</button>
  <button onclick="filterCategory('Women')" id="btn-Women" class="text-xs font-bold tracking-wider uppercase px-6 py-2.5 rounded-full border border-slate-800 bg-slate-900 text-slate-400 hover:border-cyan-500/50 hover:text-cyan-400 transition-all duration-200">WOMEN'S</button>
  <button onclick="filterCateg2ory('Unisex')" id="btn-Unisex" class="text-xs font-bold tracking-wider uppercase px-6 py-2.5 rounded-full border border-slate-800 bg-slate-900 text-slate-400 hover:border-cyan-500/50 hover:text-cyan-400 transition-all duration-200">UNISEX</button>
</div>

<section id="product-section" class="max-w-7xl mx-auto w-full px-4 py-16 flex-grow">
  <h2 class="text-2xl font-black mb-8 text-center uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-300 to-cyan-400">Semua Produk</h2>
  <div id="product-list" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
</section>

<footer class="bg-slate-950 border-t border-slate-900 text-slate-600 text-center py-6 text-sm w-full">
  <p>&copy; 2026 R Sports. All Rights Reserved.</p>
</footer>

<script src="../scripts/Product.js"></script>
</body>
</html>
